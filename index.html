a:{b:'dorm',t:'1. 숙소의 밤',l:[n('새벽 한 시가 가까운 숙소 거실. 연습을 마친 우리는 소파에 늘어져 있다. 나는 유진이 손에 든 과자 봉지만 노려본다.'),h('유진아, 한 입만. 아~'),y('형, 아까 두 봉지 먹었잖아요.'),n('말은 그렇게 하면서 유진이는 봉지를 내 쪽으로 슬쩍 민다. 내 컵에 물까지 따라 놓고.'),m('이런 사소한 게 좋아서 매일 모른 척 장난을 친다. 좋아한다는 말은 장난에도 못 섞으면서.')],

function draw(l){st.last=l;const w=l[0];$('nm').textContent=NM[w]||'';$('nm').style.display=w==='N'?'none':'';const b=$('box');b.className=w==='M'?'mono':w==='N'?'nar':'';b.innerHTML='';b.append(l[1]);const s=document.createElement('small');s.textContent='▼';b.append(s);st.lg.push(l);if(st.lg.length>120)st.lg.shift();if(sf&&!sk)tone(w==='M'?523:w==='Y'?660:w==='G'?587:440,.06,.04)}
function after(){const sc=S[st.id];if(st.q){st.q=null;return nxt()}if(sc.c)return choices(sc);nxt()}
function nxt(){const sc=S[st.id];if(sc.e)return ending(sc.e);let x=st.nx||sc.n;if(typeof x==='function')x=x(st.s);go(x)}
function choices(sc){au=0;sk=0;$('b3').classList.remove('on');$('b4').classList.remove('on');const c=$('ch');c.innerHTML='';sc.c.forEach(o=>{const b=document.createElement('button');b.textContent=o[0];b.onclick=()=>{for(const k in o[1])st.s[k]+=o[1][k];st.lg.push(['H','▶ '+o[0]]);st.q=o[2];st.i=0;st.nx=o[3]||sc.n;c.classList.add('hide');$('box').classList.remove('hide');$('nm').classList.remove('hide');if(sf)tone(700,.1,.05);show()};c.append(b)});$('box').classList.add('hide');$('nm').classList.add('hide');c.classList.remove('hide')}
function ending(k){au=sk=0;const gg=ls.g('hjg')||[];if(!gg.includes(k)){gg.push(k);ls.s('hjg',gg)}const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<small style="color:var(--pk)">'+E[k][0]+'</small><h2>'+E[k][1]+'</h2><p>'+E[k][2]+'</p>';btn(o,'엔딩 갤러리',gal);btn(o,'NEW GAME',newGame);btn(o,'타이틀로',title)}
function btn(p,t,f){const b=document.createElement('button');b.className='mb';b.textContent=t;b.onclick=f;p.append(b)}
function title(){$('game').classList.add('hide');$('ov').classList.add('hide');$('menu').classList.remove('hide');$('bc').disabled=!ls.g('hjs');au=sk=0;clearTimeout(tm)}
function gal(){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='flex-start';o.style.textAlign='left';const gg=ls.g('hjg')||[];o.innerHTML='<h2>엔딩 갤러리 ('+gg.length+'/5)</h2>';Object.keys(E).forEach(k=>{const d=document.createElement('div');d.className='gl';d.innerHTML=gg.includes(k)?'<small>'+E[k][0]+'</small><br><b>'+E[k][1]+'</b><br>'+E[k][2]:'<small>???</small><br>아직 보지 못한 엔딩';o.append(d)});btn(o,'닫기',()=>{o.classList.add('hide');if($('game').classList.contains('hide'))$('menu').classList.remove('hide')})}
function log(){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='flex-start';o.style.textAlign='left';o.innerHTML='<h2>대화 로그</h2>';st.lg.forEach(l=>{const d=document.createElement('div');d.className='lg';const b=document.createElement('b');b.textContent=(NM[l[0]]||'')+' ';d.append(b,l[1]);o.append(d)});btn(o,'닫기',()=>o.classList.add('hide'))}
$('bn').onclick=()=>{au_();newGame()};
$('bc').onclick=()=>{au_();const d=ls.g('hjs');if(!d)return;st=d;ui();$('bg').className=S[st.id].b;$('chap').textContent=S[st.id].t||'';if(st.i>=cur().length)after();else{const L=cur();draw(L[st.i-1]||st.last);st.lg.pop()}};
$('bg2').onclick=gal;$('box').onclick=()=>{if(!busy){clearTimeout(tm);show()}};
$('b1').onclick=log;$('b2').onclick=()=>{ls.s('hjs',st);toast('저장했어요')};
$('b3').onclick=e=>{au=!au;sk=0;e.target.classList.toggle('on',!!au);$('b4').classList.remove('on');au?show():clearTimeout(tm)};
$('b4').onclick=e=>{sk=!sk;au=0;e.target.classList.toggle('on',!!sk);$('b3').classList.remove('on');sk?show():clearTimeout(tm)};
$('b5').onclick=e=>{mb=!mb;e.target.classList.toggle('on',!!mb)};$('b6').onclick=e=>{sf=!sf;e.target.classList.toggle('on',!!sf)};
$('b7').onclick=()=>{ls.s('hjs',st);title()};
$('b3').classList.remove('on');$('b4').classList.remove('on');title();
</script></body></html>
